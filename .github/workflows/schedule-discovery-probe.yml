name: Schedule Discovery Probe

# Registers (or updates) a Cloud Scheduler job that runs the discovery probe on a
# recurring schedule.
#
# The schedule pins the runner arguments via Cloud Run's containerOverrides rather than
# relying on the arguments baked into the ttkit-discovery job. That matters: ad-hoc
# dispatches of "Deploy Discovery Cloud Run Job" rewrite those baked arguments, so a
# schedule that inherited them could silently start running `enroll` — which changes the
# monthly-report base — instead of `probe`.

on:
  workflow_dispatch:
    inputs:
      schedule:
        description: "unix-cron schedule (default: hourly on the hour)"
        default: "0 * * * *"
      limit:
        description: "domains per run (20000 takes ~36 min; keep well under the interval)"
        default: "10000"
      concurrency:
        description: "parallel probes"
        default: "40"
      paused:
        description: "create the schedule paused"
        type: boolean
        default: false

env:
  PROJECT_ID: apti-ttkit
  REGION: asia-northeast1
  JOB_NAME: ttkit-discovery
  SCHEDULER_NAME: ttkit-discovery-probe-hourly

jobs:
  schedule:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable Cloud Scheduler API (best effort)
        # The deploy SA is not granted serviceusage.services.enable. That is fine when the
        # API is already on; if it is not, the create step below fails with a clear error
        # and an owner needs to enable it once.
        run: |
          gcloud services enable cloudscheduler.googleapis.com --project ${{ env.PROJECT_ID }} \
            || echo "Could not enable the API (insufficient permission); continuing in case it is already enabled."

      - name: Grant the scheduler identity permission to run the job
        run: |
          SA=$(gcloud config get-value account)
          echo "SA=$SA" >> $GITHUB_ENV
          # Idempotent: re-adding an existing binding is a no-op.
          gcloud run jobs add-iam-policy-binding ${{ env.JOB_NAME }} \
            --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} \
            --member "serviceAccount:${SA}" --role roles/run.invoker \
            || echo "Could not set run.invoker (insufficient permission); continuing."
          # Cloud Scheduler mints an OAuth token as this SA, and creating such a job
          # requires actAs on it — which an SA does not hold over itself by default.
          gcloud iam service-accounts add-iam-policy-binding "$SA" \
            --project ${{ env.PROJECT_ID }} \
            --member "serviceAccount:${SA}" --role roles/iam.serviceAccountUser \
            || echo "Could not set serviceAccountUser (insufficient permission); continuing."

      - name: Create or update the schedule
        run: |
          URI="https://run.googleapis.com/v2/projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/jobs/${{ env.JOB_NAME }}:run"
          BODY='{"overrides":{"containerOverrides":[{"args":["dist/discovery/runner.js","probe","--limit","${{ github.event.inputs.limit }}","--concurrency","${{ github.event.inputs.concurrency }}"]}]}}'

          # `create` fails when the job already exists, so fall back to `update`.
          if gcloud scheduler jobs describe ${{ env.SCHEDULER_NAME }} \
               --location ${{ env.REGION }} --project ${{ env.PROJECT_ID }} >/dev/null 2>&1; then
            ACTION=update
          else
            ACTION=create
          fi

          gcloud scheduler jobs $ACTION http ${{ env.SCHEDULER_NAME }} \
            --location ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --schedule "${{ github.event.inputs.schedule }}" \
            --time-zone "Asia/Tokyo" \
            --uri "$URI" \
            --http-method POST \
            --headers "Content-Type=application/json" \
            --message-body "$BODY" \
            --oauth-service-account-email "$SA" \
            --attempt-deadline 30s \
            --max-retry-attempts 0

          if [ "${{ github.event.inputs.paused }}" = "true" ]; then
            gcloud scheduler jobs pause ${{ env.SCHEDULER_NAME }} \
              --location ${{ env.REGION }} --project ${{ env.PROJECT_ID }}
          fi

      - name: Show the resulting schedule
        run: |
          gcloud scheduler jobs describe ${{ env.SCHEDULER_NAME }} \
            --location ${{ env.REGION }} --project ${{ env.PROJECT_ID }} \
            --format="yaml(name,schedule,timeZone,state,httpTarget.uri,httpTarget.body)"
